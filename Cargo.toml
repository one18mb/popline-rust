[package]
name = "pln"
version = "0.4.0"
edition = "2021"
description = "PopLine — Line-oriented serialization format (Rust implementation)"
license = "MIT"
authors = ["one18mb"]
repository = "https://github.com/one18mb/popline-rust"
keywords = ["serialization", "popline", "json"]
categories = ["encoding", "parser-implementations"]

[lib]
name = "pln"

[dependencies]
serde_json = "1.0"
memchr = "2"

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
